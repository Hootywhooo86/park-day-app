  <title>Park Day</title>
  <style>
    :root {
      --bg: #0a0c10;
      --bg2: #0a0c10;
      --card: #12151c;
      --card2: #181d27;
      --line: rgba(255,255,255,.08);
      --text: #f4f6fa;
      --muted: #98a1b3;
      --green: #35d07f;
      --yellow: #f0c453;
      --red: #ff6b7a;
      --gray: #8b94a7;
      --accent: #8f7bf5;
      --accent-soft: rgba(143,123,245,.14);
      --gold: #e8c47a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      background: var(--bg);
      color: var(--text); min-height: 100vh; padding-bottom: 48px;
    }
    header {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      background: rgba(10,12,16,.82);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 1rem; font-weight: 650; flex: 1; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn {
      border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--text);
      border-radius: 10px; padding: 7px 11px; cursor: pointer; font-size: .9rem; font-weight: 600;
    }
    .icon-btn:active { background: rgba(255,255,255,.09); }
    .star-btn { border:0; background:transparent; color:var(--muted); font-size:1.3rem; cursor:pointer; padding:6px 4px; line-height:1; }
    .star-btn.on { color:#f5b942; }
    .ride-side { display:flex; align-items:center; gap:6px; }
    .fav-bell { border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); border-radius:999px; padding:5px 10px; font-size:.72rem; font-weight:700; cursor:pointer; white-space:nowrap; margin-top:6px; width:100%; }
    main { max-width: 680px; margin: 0 auto; padding: 16px; }
    .hero {
      background: var(--card);
      border: 1px solid var(--line); border-radius: 16px; padding: 18px;
      margin-bottom: 12px;
    }
    .hero h2 { font-size: 1.3rem; margin-bottom: 4px; letter-spacing: -.01em; }
    .hero p { color: var(--muted); font-size: .9rem; line-height: 1.45; }
    .home-card, .park-card, .item-card, .food-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .home-card { margin-bottom: 10px; cursor: pointer; }
    .home-card:active, .park-card:active, .item-card:active { transform: scale(.985); background: var(--card2); }
    .home-left { display: flex; gap: 12px; align-items: center; }
    .badge-icon {
      width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
      background: var(--accent-soft); font-size: 1.25rem; flex-shrink: 0;
    }
    .kicker { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
    .title { font-size: 1rem; font-weight: 650; letter-spacing: -.01em; }
    .sub { font-size: .8rem; color: var(--muted); margin-top: 2px; }
    .search {
      width: 100%; margin: 4px 0 14px; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 1rem;
    }
    .search:focus { outline: none; border-color: var(--accent); }
    .search::placeholder { color: var(--gray); }
    .section { font-size: .7rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-weight: 700; margin: 20px 0 8px; }
    .park-grid { display: grid; gap: 8px; }
    .hours-chip { font-size: .75rem; color: var(--muted); text-align: right; white-space: nowrap; }
    .hours-chip b { color: var(--text); display: block; font-size: .82rem; }
    .weather {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card);
      border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
    }
    .temp { font-size: 1.7rem; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .unit-toggle { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; flex-shrink: 0; }
    .unit-toggle button { border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: .78rem; padding: 7px 11px; border-radius: 9px; cursor: pointer; }
    .unit-toggle button.on { background: var(--accent-soft); color: var(--text); }
    .legend { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: .75rem; margin: 8px 0 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .land-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin: 20px 0 10px; padding: 6px 2px 4px;
    }
    .land-head .land {
      margin: 0; padding: 4px 0;
      font-size: .95rem; font-weight: 750; color: var(--text);
      letter-spacing: .06em; text-transform: uppercase; line-height: 1.2; flex: 1; min-width: 0;
    }
    .land {
      margin: 16px 0 8px; padding: 8px 2px;
      font-size: .85rem; font-weight: 750; color: var(--text); letter-spacing: .06em; text-transform: uppercase;
    }
    .land-map { flex-shrink: 0; opacity: .95; }
    .land-map svg { width: 120px; height: auto; display: block; }
    .item-card { margin-bottom: 8px; cursor: default; }
    .wait {
      min-width: 68px; text-align: center; font-weight: 750; font-size: .88rem;
      padding: 6px 10px; border-radius: 999px; font-variant-numeric: tabular-nums;
    }
    .g { background: rgba(53,208,127,.13); color: var(--green); }
    .y { background: rgba(240,196,83,.13); color: var(--yellow); }
    .r { background: rgba(255,107,122,.14); color: var(--red); }
    .z { background: rgba(139,148,167,.13); color: var(--gray); }
    .ll { font-size: .7rem; color: var(--muted); margin-top: 3px; text-align: right; }
    .note { color: var(--muted); font-size: .78rem; text-align: center; margin-top: 16px; line-height: 1.45; }
    .note a { color: var(--accent); }
    .loading { text-align: center; padding: 48px 16px; color: var(--muted); }
    #toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 200;
      transform: translateX(-50%) translateY(20px);
      background: #1d2230; color: #fff; border: 1px solid rgba(255,255,255,.12);
      padding: 12px 18px; border-radius: 14px; font-size: .9rem;
      max-width: 88vw; text-align: center;
      opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .spin { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 10px; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
    .tab { flex: 1; text-align: center; padding: 9px 8px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-weight: 650; font-size: .82rem; cursor: pointer; }
    .tab.on { background: var(--accent-soft); color: var(--text); }
    .menu-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .menu-row:last-child { border-bottom: none; }
    .add-btn { border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 12px 14px; font-weight: 700; cursor: pointer; width: 100%; font-size: .95rem; }
    .add-btn:active { filter: brightness(1.1); }
    .cart {
      position: sticky; bottom: 10px; margin-top: 16px;
      background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
      box-shadow: 0 12px 32px rgba(0,0,0,.35);
    }
    .thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: var(--card2); }
    .cat-row { display: flex; gap: 6px; margin: 8px 0 12px; flex-wrap: wrap; }
    .cat-row button { flex: 1; min-width: 72px; }
    .cart b { font-size: 1.05rem; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .calhead { font-size: .65rem; color: var(--muted); text-align: center; padding: 4px 0; }
    .day {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      min-height: 54px; padding: 6px 4px; text-align: center; font-size: .72rem;
    }
    .day .n { font-weight: 800; display: block; }
    .day .h { color: var(--muted); font-size: .62rem; }
    .day.today { border-color: var(--accent); }
    .day.wknd { background: rgba(255,255,255,.02); }
    footer { text-align: center; color: var(--muted); font-size: .68rem; padding: 24px 16px; line-height: 1.5; }
    footer a { color: var(--accent); }
    .fx-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 12px; }
    .fx-row label { font-size:.78rem; color:var(--muted); }
    .fx-convert { font-size:.95rem; font-weight:600; margin-top:8px; color:var(--muted); }
    .fx-convert .fx-amount { color:var(--red); font-weight:750; }
    .budget-left { font-size:1.05rem; font-weight:700; margin-top:8px; color:var(--good,#3d9a5f); }
    .budget-over { font-size:1.05rem; font-weight:700; margin-top:8px; color:var(--bad,#c44); }
    .budget-prompt { font-size:.8rem; margin-top:8px; color:var(--muted); }
    .budget-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
    .budget-controls input { flex:1; min-width:100px; }
    .fx-row select, .dmg-select {
      padding:10px 12px; border-radius:12px; border:1px solid var(--line);
      background:var(--card); color:var(--text); font-size:.95rem;
    }
    .dmg-select { width:100%; margin:0 0 8px; }
    .ocr-status { font-size:.82rem; color:var(--accent); margin:6px 0 10px; min-height:1.2em; }
    .day-scan { background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:8px; overflow:hidden; }
    .day-scan > summary {
      list-style:none; cursor:pointer; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px;
    }
    .day-scan > summary::-webkit-details-marker { display:none; }
    .day-scan[open] > summary { border-bottom:1px solid var(--line); }
    .day-scan .receipt-row { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:flex-start; }
    .day-scan .receipt-row:last-child { border-bottom:none; }
    textarea.search { min-height:72px; resize:vertical; font-family:inherit; line-height:1.4; }

    .home-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .home-btn {
      display: flex; align-items: center; gap: 14px;
      width: 100%; text-align: left; cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 16px; padding: 16px;
      background: var(--card);
      color: var(--text); transition: transform .12s ease, background .12s ease;
    }
    .home-btn:active { transform: scale(.98); background: var(--card2); }
    .home-btn .home-emoji {
      width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
      display: grid; place-items: center; font-size: 1.4rem;
      background: var(--accent-soft);
    }
    .home-btn .home-label { font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
    .home-btn .home-hint { font-size: .82rem; color: var(--muted); line-height: 1.35; margin-top: 2px; }
    .home-hero {
      text-align: left; padding: 20px 4px 14px;
    }
    .home-hero h2 {
      font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; letter-spacing: -.02em;
    }
    .home-hero p { color: var(--muted); font-size: .92rem; line-height: 1.45; max-width: 28rem; }
    .resume-btn {
      display: block; width: 100%; text-align: left; cursor: pointer;
      border: 1px solid transparent; border-radius: 14px; padding: 13px 16px; margin-bottom: 10px;
      background: var(--accent-soft); color: var(--text);
      font-size: .92rem; font-weight: 700;
    }
    .resume-btn:active { filter: brightness(1.15); }
    .hrs-line:empty { display: none; }
    .hrs-line { color: var(--accent); font-weight: 600; }
  </style>
</head>

function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function waitClass(m){ if(m==null) return "z"; if(m<=15) return "g"; if(m<=40) return "y"; return "r"; }
function formatWait(m){ return m==null ? "—" : m+" min"; }
function formatTime(iso){
  if(!iso) return "—";
  try { return new Date(iso).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); } catch { return "—"; }
}
function weatherText(code){
  const m={0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",61:"Rain",63:"Rain",65:"Heavy rain",80:"Showers",95:"Storms"};
  return m[code]||"—";
}
function landFor(parkId, name){
  const raw=(name||"").toLowerCase();
  const n=raw.replace(/[^a-z0-9&\s]/g," "); // ignore commas/punctuation in titles
  const groups=LANDS[parkId];
  if(groups){
    for(const [land, keys] of groups){
      if(keys.some(k=>{
        const kk=k.toLowerCase();
        return n.includes(kk) || raw.includes(kk);
      })) return land;
    }
  }
  return "More around the park";
}
function menuFor(name){
  const lower=(name||"").toLowerCase();
  if(MENUS[name] && name!=="defaultQuick") return MENUS[name];
  const keys=Object.keys(MENUS).filter(k=>k!=="defaultQuick");
  const hit=keys.find(k=>{
    const kL=k.toLowerCase();
    return lower.includes(kL) || kL.includes(lower) ||
      lower.replace(/['’]/g,"").includes(kL.replace(/['’]/g,""));
  });
  return hit ? MENUS[hit] : [];
}

function showLoading(msg){ document.getElementById("app").innerHTML = `<div class="loading"><div class="spin"></div>${esc(msg||"Loading…")}</div>`; }
function showError(msg){ document.getElementById("app").innerHTML = `<div class="hero"><h2>Couldn’t load</h2><p>${esc(msg)}</p></div><button class="icon-btn" onclick="loadHome()">Try again</button>`; }

// Non-blocking toast replaces window.alert (alerts are unreliable in mobile webviews)
function toast(msg){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h=setTimeout(()=>t.classList.remove("show"), 3200);
}
// fetch with a timeout so slow networks (or a cold sync worker) can't hang the UI
async function fetchTimeout(url, opts={}, ms=12000){
  const c=new AbortController();
  const h=setTimeout(()=>c.abort(), ms);
  try{ return await fetch(url, {...opts, signal:c.signal}); }
  finally{ clearTimeout(h); }
}
// The OCR engine is heavy (~2MB) — only download it the first time a receipt is scanned
let _tessPromise=null;
function loadTesseract(){
  if(typeof Tesseract!=="undefined") return Promise.resolve();
  if(!_tessPromise){
    _tessPromise=new Promise((res,rej)=>{
      const s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload=()=>res(); s.onerror=()=>rej(new Error("tesseract load"));
      document.head.appendChild(s);
    });
  }
  return _tessPromise;
}

function showParkList(m){
  mode=m; view="list";
  document.getElementById("backBtn").style.display="block";
  document.getElementById("refreshBtn").style.display="none";
  document.getElementById("pageTitle").textContent = m==="waits"?"Ride waits":"Food & carts";
  const sorted=[...destinations].sort((a,b)=>{
    const ai=PRIORITY.indexOf(a.slug), bi=PRIORITY.indexOf(b.slug);
    if(ai!==-1&&bi!==-1) return ai-bi; if(ai!==-1) return -1; if(bi!==-1) return 1;
    return a.name.localeCompare(b.name);
  });
  let html=`<input class="search" id="search" placeholder="Search parks…" autocomplete="off" enterkeyhint="search" oninput="filterParks()">`;
  for(const dest of sorted){
    html+=`<div class="section">${esc(dest.name)}</div><div class="park-grid">`;
    for(const park of dest.parks){
      const click = m==="food"
        ? `openPark('${park.id}','${esc(park.name).replace(/'/g,"\\'")}','food')`
        : `openPark('${park.id}','${esc(park.name).replace(/'/g,"\\'")}','waits')`;
      html+=`<div class="park-card" data-name="${esc((park.name+" "+dest.name).toLowerCase())}" onclick="${click}">
        <div><div class="title">${esc(park.name)}</div><div class="sub">${esc(dest.name)}</div><div class="sub hrs-line" data-hours="${park.id}"></div></div>
        <div>›</div>
      </div>`;
    }
    html+=`</div>`;
  }
  document.getElementById("app").innerHTML=html;
  observeHours();
}

function filterParks(){
  const q=(document.getElementById("search")?.value||"").toLowerCase().trim();
  document.querySelectorAll(".park-card").forEach(c=>c.style.display=(!q||c.dataset.name.includes(q))?"flex":"none");
}

async function getHours(parkId){
  if(hoursCache[parkId] && Date.now()-hoursCache[parkId].ts<10*60*1000) return hoursCache[parkId].data;
  try{
    const res=await fetchTimeout(`${API}/entity/${parkId}/schedule`);
    if(!res.ok) return null;
    const data=await res.json();
    const today=new Date().toISOString().slice(0,10);
    const entry=(data.schedule||[]).find(s=>s.date===today) || (data.schedule||[])[0];
    const info = entry ? {
      label: entry.type==="OPERATING"?"Open today":(entry.type||"Hours"),
      range: `${formatTime(entry.openingTime)} – ${formatTime(entry.closingTime)}`
    } : null;
    hoursCache[parkId]={ts:Date.now(), data:info};
    return info;
  }catch{return null;}
}

// Fill in today's hours under each park card as it scrolls into view
function observeHours(){
  const els=[...document.querySelectorAll("[data-hours]")];
  if(!els.length) return;
  const load=async (el)=>{
    const hrs=await getHours(el.dataset.hours);
    if(document.body.contains(el)) el.textContent=hrs?`${hrs.label} · ${hrs.range}`:"";
  };
  if("IntersectionObserver" in window){
    const io=new IntersectionObserver((entries)=>{
      entries.forEach(en=>{ if(en.isIntersecting){ io.unobserve(en.target); load(en.target); } });
    },{rootMargin:"200px"});
    els.forEach(el=>io.observe(el));
  }else{
    els.forEach(load);
  }
}

async function getWeather(parkId){
  if(weatherCache[parkId] && Date.now()-weatherCache[parkId].ts<10*60*1000) return weatherCache[parkId].data;
  const c=PARK_COORDS[parkId]; if(!c) return null;
  const u=getTempUnit();
  try{
    const res=await fetchTimeout(`https://api.open-meteo.com/v1/forecast?latitude=${c[0]}&longitude=${c[1]}&current=temperature_2m,weather_code,apparent_temperature,wind_speed_10m&temperature_unit=${u==="C"?"celsius":"fahrenheit"}&wind_speed_unit=${u==="C"?"kmh":"mph"}`);
    if(!res.ok) return null;
    const data=await res.json();
    weatherCache[parkId]={ts:Date.now(), data}; return data;
  }catch{return null;}
}

// Temperature unit preference — Canadians get Celsius by default, obviously
function getTempUnit(){
  try{ return localStorage.getItem("pd_tempUnit")==="F" ? "F" : "C"; }catch{ return "C"; }
}
function setTempUnit(u){
  try{ localStorage.setItem("pd_tempUnit", u); }catch{}
  weatherCache={}; // refetch in the new unit
  if(currentPark && (view==="waits"||view==="food")){
    refreshParkData(currentPark.id, view, true);
  } else {
    toast(u==="C" ? "Weather in °C from now on." : "Weather in °F from now on.");
  }
}

function saveLastPark(id, name, kind){
  try{ localStorage.setItem("pd_lastPark", JSON.stringify({id, name, kind, ts:Date.now()})); }catch{}
}
function getLastPark(){
  try{
    const p=JSON.parse(localStorage.getItem("pd_lastPark")||"null");
    if(p && p.id && Date.now()-p.ts < 24*3600*1000) return p; // a park day is today
  }catch{}
  return null;
}

async function openPark(parkId, parkName, kind, silent){
  view=kind; currentPark={id:parkId,name:parkName};
  saveLastPark(parkId, parkName, kind);
  document.getElementById("backBtn").style.display="block";
  document.getElementById("refreshBtn").style.display="block";
  document.getElementById("pageTitle").textContent=parkName;
  const cached=liveCache[parkId];
  if(cached && Date.now()-cached.ts < 90*1000){
    // Instant: paint what we have, then refresh quietly underneath
    try{
      if(kind==="food") renderFood(cached.live, cached.children, cached.weather);
      else renderRides(cached.live, cached.weather);
    }catch{}
    refreshParkData(parkId, kind, true);
    return;
  }
  if(!silent) showLoading(kind==="food"?"Loading food spots…":"Loading live waits…");
  await refreshParkData(parkId, kind, silent);
}

async function refreshParkData(parkId, kind, silent){
  try{
    const [liveRes, childRes, weather] = await Promise.all([
      fetchTimeout(`${API}/entity/${parkId}/live`),
      fetchTimeout(`${API}/entity/${parkId}/children`),
      getWeather(parkId)
    ]);
    if(!liveRes.ok) throw new Error("live");
    const live=await liveRes.json();
    const children=childRes.ok ? await childRes.json() : {children:[]};
    // Drop late responses if the user already moved on
    if(!currentPark || currentPark.id!==parkId || view!==kind) return;
    liveCache[parkId]={ts:Date.now(), live, children, weather};
    if(kind==="food") renderFood(live, children, weather);
    else renderRides(live, weather);
  }catch(e){
    if(!silent){
      // Prefer a slightly stale screen over an error screen
      const cached=liveCache[parkId];
      if(cached){
        try{
          if(kind==="food") renderFood(cached.live, cached.children, cached.weather);
          else renderRides(cached.live, cached.weather);
          toast("Couldn’t refresh — showing last update.");
          return;
        }catch{}
      }
      showError("Could not load this park right now.");
    }
    else toast("Couldn’t refresh waits — will retry.");
    console.error(e);
  }
}

function weatherBar(w){
  if(!w?.current) return "";
  const u=getTempUnit(), deg=u==="C"?"°C":"°F";
  return `<div class="weather"><div><div class="temp">${Math.round(w.current.temperature_2m)}${deg}</div>
    <div class="sub">${weatherText(w.current.weather_code)} · Feels ${Math.round(w.current.apparent_temperature)}${deg}</div></div>
    <div class="unit-toggle" role="group" aria-label="Temperature unit">
      <button type="button" class="${u==="C"?"on":""}" onclick="setTempUnit('C')" aria-pressed="${u==="C"}">°C</button>
      <button type="button" class="${u==="F"?"on":""}" onclick="setTempUnit('F')" aria-pressed="${u==="F"}">°F</button>
    </div></div>`;
}

// Favorite rides: {parkId: {rideId: alertThresholdMinutes|null}}
function loadFavs(){ try{ return JSON.parse(localStorage.getItem("pd_favs")||"{}"); }catch{ return {}; } }
function saveFavs(f){ try{ localStorage.setItem("pd_favs", JSON.stringify(f)); }catch{} }
function parkFavs(parkId){ const f=loadFavs(); return (f[parkId]&&typeof f[parkId]==="object")?f[parkId]:{}; }
function toggleFav(rideId){
  const pid=currentPark.id, favs=loadFavs();
  favs[pid]=favs[pid]||{};
  if(favs[pid][rideId]!=null){ delete favs[pid][rideId]; toast("Removed from favorites."); }
  else { favs[pid][rideId]=null; toast("★ Added to favorites."); }
  saveFavs(favs);
  const cached=liveCache[pid];
  if(cached) renderRides(cached.live, cached.weather);
}
const ALERT_STEPS=[0,15,30,45,60];
function cycleAlert(rideId){
  const pid=currentPark.id, favs=loadFavs();
  favs[pid]=favs[pid]||{};
  const cur=+favs[pid][rideId]||0;
  const next=ALERT_STEPS[(ALERT_STEPS.indexOf(cur)+1)%ALERT_STEPS.length]||null;
  favs[pid][rideId]=next;
  saveFavs(favs);
  toast(next?`🔔 Alert when under ${next} min.`:`Alert off.`);
  const cached=liveCache[pid];
  if(cached) renderRides(cached.live, cached.weather);
}
const alertedFavs={}; // "parkId:rideId" -> true, resets when the wait climbs back up
function checkAlerts(parkId, live){
  const favs=parkFavs(parkId);
  const ids=Object.keys(favs).filter(id=>Number.isFinite(+favs[id])&&+favs[id]>0);
  if(!ids.length) return;
  const map={};
  for(const e of (live.liveData||[])) map[e.id]=e;
  ids.forEach(id=>{
    const e=map[id]; if(!e) return;
    const wait=e.queue?.STANDBY?.waitTime ?? null;
    const th=+favs[id], key=parkId+":"+id;
    if(e.status==="OPERATING" && wait!=null && wait<=th){
      if(!alertedFavs[key]){ alertedFavs[key]=true; toast(`🔔 ${e.name}: ${wait} min — under your ${th} min alert`); }
    } else {
      delete alertedFavs[key];
    }
  });
}
function rideRowHtml(r, favs, inFavs){
  const open=r.status==="OPERATING";
  const fav=favs[r.id]!=null, th=+favs[r.id]||0;
  const bell=inFavs?`<button type="button" class="fav-bell" title="Wait alert" onclick="cycleAlert('${r.id}')">${th>0?`🔔 ≤${th}m`:`🔕 off`}</button>`:"";
  return `<div class="item-card"><div><div class="title">${esc(r.name)}</div>
    ${!open?`<div class="sub">${esc(r.status||"Closed")}</div>`:""}
    ${open&&r.single!=null?`<div class="sub">Single rider ${r.single} min</div>`:""}</div>
    <div class="ride-side"><button type="button" class="star-btn${fav?" on":""}" aria-label="${fav?"Remove from":"Add to"} favorites" onclick="toggleFav('${r.id}')">${fav?"★":"☆"}</button>
    <div><div class="wait ${open?waitClass(r.standby):"z"}">${open?formatWait(r.standby):esc(r.status||"Closed")}</div>
    ${r.ll?`<div class="ll">LL ${esc(r.ll)}</div>`:""}${bell}</div></div></div>`;
}
function renderRides(live, weather){
  const rides=(live.liveData||[]).filter(e=>e.entityType==="ATTRACTION").map(e=>{
    const standby=e.queue?.STANDBY?.waitTime ?? null;
    const single=e.queue?.SINGLE_RIDER?.waitTime ?? null;
    const rt=e.queue?.RETURN_TIME || e.queue?.PAID_RETURN_TIME;
    let ll=null;
    if(rt){
      if(rt.state==="AVAILABLE"||rt.returnStart){
        const s=formatTime(rt.returnStart), en=formatTime(rt.returnEnd);
        ll = s && s!=="—" ? (en && en!=="—" ? `${s} – ${en}` : s) : "Available";
      } else if(rt.state==="FINISHED") ll="Sold out";
    }
    return {id:e.id,name:e.name,status:e.status,standby,single,ll,land:landFor(currentPark.id,e.name)};
  });
  const favs=parkFavs(currentPark.id);
  const favRides=rides.filter(r=>favs[r.id]!=null).sort((a,b)=>a.name.localeCompare(b.name));
  const groups={};
  for(const r of rides){ (groups[r.land] ||= []).push(r); }
  Object.values(groups).forEach(list=>list.sort((a,b)=>a.name.localeCompare(b.name)));
  const order=Object.keys(groups).sort((a,b)=> a==="More around the park"?1:b==="More around the park"?-1:a.localeCompare(b));

  let html=weatherBar(weather);
  html+=`<div class="legend"><span><span class="dot" style="background:var(--green)"></span>1–15</span><span><span class="dot" style="background:var(--yellow)"></span>16–40</span><span><span class="dot" style="background:var(--red)"></span>41+</span></div>`;
  if(favRides.length){
    html+=`<div class="section">★ Favorites</div>`;
    favRides.forEach(r=>{ html+=rideRowHtml(r,favs,true); });
  }
  for(const land of order){
    html+=landHeaderHtml(currentPark.id, land);
    for(const r of groups[land]) html+=rideRowHtml(r,favs,false);
  }
  html+=`<div class="note">Updated ${new Date().toLocaleTimeString()}</div>`;
  document.getElementById("app").innerHTML=html;
  checkAlerts(currentPark.id, live);
}

function renderFood(live, children, weather){
  const liveMap={};
  for(const e of (live.liveData||[])){
    if(e.entityType==="RESTAURANT") liveMap[e.id]=e;
  }
  let raw=(children.children||[]).filter(c=>c.entityType==="RESTAURANT");
  if(!raw.length) raw=(live.liveData||[]).filter(e=>e.entityType==="RESTAURANT");
  const spots=raw.map(c=>{
    const l=liveMap[c.id];
    return {
      id:c.id, name:c.name, status:l?.status || "UNKNOWN",
      dining:l?.diningAvailability || null,
      land:landFor(currentPark.id,c.name)
    };
  }).sort((a,b)=>a.name.localeCompare(b.name));
  const groups={};
  for(const s of spots){ (groups[s.land] ||= []).push(s); }
  const order=Object.keys(groups).sort((a,b)=> a==="More around the park"?1:b==="More around the park"?-1:a.localeCompare(b));

  let html=weatherBar(weather);
  html+=`<div class="note" style="text-align:left;margin:0 0 12px">Tap a spot to see items for that location only.</div>`;
  if(!spots.length) html+=`<div class="loading">No dining locations listed for this park.</div>`;
  for(const land of order){
    html+=landHeaderHtml(currentPark.id, land);
    for(const s of groups[land]){
      html+=`<div class="item-card" onclick='openMenu(${JSON.stringify({id:s.id,name:s.name}).replace(/'/g,"&#39;")})'>
        <div><div class="title">${esc(s.name)}</div></div>
        <div style="color:var(--muted)">›</div></div>`;
    }
  }
  html+=renderCart();
  document.getElementById("app").innerHTML=html;
}

// Daily Damages is local-only: everything lives in this phone's storage.
// No accounts, no PINs, no server — what you delete stays deleted.
const STORE_KEY="parkday-store";
function storeKey(){ return STORE_KEY; }
function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||"{}"); }catch{ return {}; } }
function saveStore(s){ localStorage.setItem(STORE_KEY, JSON.stringify(pruneStore(s||{}))); }
// Drop days with no receipts so empty days never pile up.
// (Budgets live under __budgets and are kept — they apply when receipts are added.)
function pruneStore(s){
  Object.keys(s||{}).forEach(k=>{
    if(k==="__budgets") return;
    if(!Array.isArray(s[k])||!s[k].length) delete s[k];
  });
  return s;
}
// One-time move from the old per-account keys to the single local store.
function migrateStore(){
  try{
    if(localStorage.getItem(STORE_KEY)!=null) return;
    let best=null,bestScore=-1;
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k||!k.startsWith("parkday-store-")) continue;
      try{
        const s=JSON.parse(localStorage.getItem(k)||"{}");
        const score=Object.keys(s).filter(x=>x!=="__budgets"&&Array.isArray(s[x])).reduce((n,x)=>n+s[x].length,0);
        if(score>bestScore){ bestScore=score; best=s; }
      }catch(e){}
    }
    if(best&&bestScore>0) localStorage.setItem(STORE_KEY, JSON.stringify(pruneStore(best)));
    const drop=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&(k.startsWith("parkday-store-")||k==="parkday-account"||k==="parkday-expires"||k==="parkday-tombs")) drop.push(k);
    }
    drop.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
}
function dayId(){ return new Date().toISOString().slice(0,10); }
const FX_FALLBACK={USD:1,CAD:1.40,EUR:0.87,GBP:0.75,MXN:17.2,JPY:157,AUD:1.40,NZD:1.55,CHF:0.80};
let FX=Object.assign({},FX_FALLBACK);
let fxMeta={source:"fallback",updated:null};
const CURRENCIES=["USD","CAD","EUR","GBP","MXN","JPY","AUD","NZD","CHF"];
const FX_CACHE_KEY="parkday-fx";
function loadFxCache(){
  try{
    const raw=JSON.parse(localStorage.getItem(FX_CACHE_KEY)||"null");
    if(raw&&raw.rates&&typeof raw.rates==="object"){
      CURRENCIES.forEach(c=>{
        if(c==="USD"){ FX.USD=1; return; }
        if(raw.rates[c]!=null) FX[c]=+raw.rates[c];
      });
      FX.USD=1;
      fxMeta={source:"cached",updated:raw.updated||null};
      return true;
    }
  }catch{}
  return false;
}
loadFxCache();
function getDisplayCurrency(){ return localStorage.getItem("parkday-display-currency")||"USD"; }
function setDisplayCurrency(c){ localStorage.setItem("parkday-display-currency",c||"USD"); }
function getConvertCurrency(){
  const c=localStorage.getItem("parkday-convert-currency")||"CAD";
  return CURRENCIES.includes(c)?c:"CAD";
}
function setConvertCurrency(c){ localStorage.setItem("parkday-convert-currency",CURRENCIES.includes(c)?c:"CAD"); }
function convertAmount(amount,fromCur,toCur){
  const f=FX[fromCur]||1, t=FX[toCur]||1;
  return (+amount||0)/f*t;
}
function fmtFxStamp(isoOrUtc){
  if(!isoOrUtc) return "";
  try{
    const d=new Date(isoOrUtc);
    if(Number.isNaN(d.getTime())){
      return String(isoOrUtc).replace(/^\w+,\s*/,"").replace(/\s+\+\d{4}$/,"").slice(0,18).trim();
    }
    return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  }catch{ return ""; }
}
function fxStatusLine(){
  const stamp=fmtFxStamp(fxMeta.updated);
  if(fxMeta.source==="live") return "Live rates"+(stamp?" · updated "+stamp:"");
  if(fxMeta.source==="cached") return "Cached rates"+(stamp?" · "+stamp:"");
  return "Fallback rates · approx";
}
async function ensureFxRates(){
  try{
    const res=await fetchTimeout("https://open.er-api.com/v6/latest/USD");
    if(!res.ok) throw new Error("fx http");
    const data=await res.json();
    if(data.result!=="success"||!data.rates) throw new Error("fx bad");
    const next={USD:1};
    CURRENCIES.forEach(c=>{
      if(c==="USD") return;
      if(data.rates[c]!=null) next[c]=+data.rates[c];
      else next[c]=FX[c]!=null?FX[c]:FX_FALLBACK[c];
    });
    Object.assign(FX,next);
    const updated=data.time_last_update_utc||new Date().toISOString();
    fxMeta={source:"live",updated};
    try{ localStorage.setItem(FX_CACHE_KEY, JSON.stringify({rates:Object.assign({},FX),updated})); }catch{}
  }catch(e){
    if(fxMeta.source==="fallback") loadFxCache();
  }
  return FX;
}
function fmtMoney(amount,cur){ return "$"+Number(amount||0).toFixed(2)+" "+(cur||"USD"); }
function migrateItem(i){
  if(!i||typeof i!=="object") return i;
  return Object.assign({},i,{
    currency:i.currency||"USD",
    items:Array.isArray(i.items)?i.items:[]
  });
}
function normalizeList(list){ return (list||[]).map(migrateItem); }
function loadDamages(){ const s=loadStore(); return normalizeList(s[dayId()]||[]); }
function saveDamages(list){ const s=loadStore(); s[dayId()]=normalizeList(list); saveStore(s); }
function loadBudgets(){
  const s=loadStore();
  const b=s.__budgets;
  return (b && typeof b==="object" && !Array.isArray(b)) ? b : {};
}
function saveBudget(day, budget){

  if(budget==null){
    delete s.__budgets[day];

    if(!Number.isFinite(amount)) return;
    const currency=CURRENCIES.includes(budget.currency)?budget.currency:(budget.currency||"USD");

function parseReceiptText(text){
  const rawLines=(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const lines=rawLines.map(l=>l.replace(/\s+/g," ").trim());
  // Accept $186.90, $186.9, 186.90, and spaced OCR like $1 86.90 / $186 .90
  const moneyGlobal=/(\$?)\s*((?:[0-9]\s*){1,5}(?:[.,]\s*[0-9]{1,2}))/g;
  const moneyTest=/\$?\s*(?:[0-9]\s*){1,5}(?:[.,]\s*[0-9]{1,2})/;
  const kwGrand=/\bgrand\s*total\b/i;
  const kwTotalPaid=/\btotal\s*paid\b/i;
  const kwPaid=/\bpaid\b/i;
  const kwTotal=/\btotal\b/i;
  const badKw=/\b(sub\s*total|subtotal|tax|tip|gratuity|suggested|change|cash\s*back|balance\s*due|amount\s*due)\b/i;
  const isSubtotal=/\bsub\s*total\b|\bsubtotal\b/i;
  const n=lines.length;
  const candidates=[];
  function normalizeMoneyToken(tok){
    return String(tok||"").replace(/\s+/g,"").replace(",",".");
  }
  function extractAmounts(str){
    const out=[];
    if(!str) return out;
    moneyGlobal.lastIndex=0;
    let m;
    while((m=moneyGlobal.exec(str))){
      const v=parseFloat(normalizeMoneyToken(m[2]));
      if(Number.isFinite(v)&&v>0) out.push({value:v, hasDollar:!!m[1]});
    }
    return out;
  }
  function focusScore(line, hasDollar){
    if(isSubtotal.test(line)) return -999;
    let score=0;
    if(kwGrand.test(line) || kwTotalPaid.test(line)) score+=80;
    else if(/\btotal\s+paid\b/i.test(line)) score+=80;
    else if(kwPaid.test(line) && !/\bunpaid\b/i.test(line)) score+=60;
    else if(kwTotal.test(line)) score+=50;
    else return -999;
    if(hasDollar) score+=10;
    if(badKw.test(line) && !kwGrand.test(line) && !kwTotalPaid.test(line) && !kwPaid.test(line)) score-=40;
    return score;
  }
  for(let i=0;i<n;i++){
    const line=lines[i];
    const hasFocus=kwGrand.test(line)||kwTotalPaid.test(line)||kwPaid.test(line)||(kwTotal.test(line)&&!isSubtotal.test(line));
    if(!hasFocus) continue;
    let amounts=extractAmounts(line);
    if(!amounts.length){
      for(let j=1;j<=3&&i+j<n;j++){
        amounts=extractAmounts(lines[i+j]);
        if(amounts.length) break;
      }
    }
    amounts.forEach(a=>{
      const sc=focusScore(line,a.hasDollar);
      if(sc>-900) candidates.push({value:a.value, score:sc, lineIdx:i});
    });
  }
  let total=null;
  let kwScore=0;
  if(candidates.length){
    // Prefer keyword strength; do not boost bottom-of-page over a clear early TOTAL
    candidates.sort((a,b)=>b.score!==a.score?b.score-a.score:b.lineIdx-a.lineIdx);
    total=candidates[0].value;
    kwScore=candidates[0].score;
  }
  function cleanMerchantLine(s){
    return String(s||"")
      .replace(/[¥€£¢©®™§†‡•·|\\/_^=~`<>{}[\]()]+/g," ")
      .replace(/[^A-Za-z0-9 '&.,\-]/g," ")
      .replace(/\s+/g," ")
      .trim();
  }
  function looksLikeStoreName(s){
    if(!s||s.length<2||s.length>48) return false;
    if(moneyTest.test(s)) return false;
    if(/^\d/.test(s)) return false;
    if(/\b(total|subtotal|tax|receipt|invoice|tel|phone|www|http|thank|paid|grand|amount|balance|change|visa|mastercard|debit|credit)\b/i.test(s)) return false;
    const letters=(s.match(/[A-Za-z]/g)||[]).length;
    return letters>=3;
  }
  let merchant="";
  const head=rawLines.slice(0,8).map(cleanMerchantLine).filter(Boolean);
  // Prefer Psycho Bunny-style logo OCR (fragment + Bunny)
  let hasPsycho=false, hasBunny=false;
  for(const h of head){
    if(/\bbunn?y\b/i.test(h)) hasBunny=true;
    if(/psycho|psycht|psych|ps[yi]cho/i.test(h)) hasPsycho=true;
  }
  if(hasBunny && hasPsycho) merchant="Psycho Bunny";
  else if(hasBunny){
    // Join short adjacent fragments ending with Bunny
    for(let i=0;i<head.length;i++){
      if(/\bbunn?y\b/i.test(head[i])){
        const prev=i>0?head[i-1]:"";
        if(prev && prev.length<=12 && /[A-Za-z]{3,}/.test(prev) && !moneyTest.test(prev)){
          const joined=cleanMerchantLine(prev+" "+head[i]);
          if(/psycho|psycht|psych/i.test(joined)) merchant="Psycho Bunny";
          else merchant=joined.replace(/\bpsycht\b/i,"Psycho").replace(/\bpsych\b/i,"Psycho");
        }else{
          merchant=head[i].replace(/\bbunn?y\b/i,"Bunny");
        }
        break;
      }
    }
  }
  if(!merchant){
    for(let i=0;i<head.length;i++){
      const a=head[i];
      const b=head[i+1]||"";
      // Join two short fragments into a store name
      if(a.length<=14 && b.length<=14 && looksLikeStoreName(a) && looksLikeStoreName(b)){
        const words=(a+" "+b).match(/[A-Za-z]{2,}/g)||[];
        if(words.length>=2){
          merchant=cleanMerchantLine(a+" "+b);
          break;
        }
      }
      const words=a.match(/[A-Za-z]{2,}/g)||[];
      if(looksLikeStoreName(a) && (words.length>=2 || /\b[A-Za-z]{4,}\b/.test(a))){
        merchant=a;
        break;
      }
    }
  }
  if(!merchant){
    for(const line of head){
      if(looksLikeStoreName(line)){ merchant=line; break; }
    }
  }
  return {total, merchant, kwScore};
}

function preprocessReceiptForOCR(dataUrl){
  return new Promise(async (resolve,reject)=>{
    try{
      const max=1600;
      let bitmap=null;
      try{
        const blob=await (await fetch(dataUrl)).blob();
        if(typeof createImageBitmap==="function"){
          bitmap=await createImageBitmap(blob,{imageOrientation:"from-image"});
        }
      }catch(_){ bitmap=null; }
      const draw=(w0,h0,drawFn)=>{
        let w=w0,h=h0;
        const edge=Math.max(w,h);
        if(edge>max){ const s=max/edge; w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement("canvas");
        c.width=w; c.height=h;
        const ctx=c.getContext("2d");
        drawFn(ctx,w,h);
        const id=ctx.getImageData(0,0,w,h);
        const d=id.data;
        let min=255,maxv=0;
        const gray=new Float32Array(w*h);
        for(let i=0,p=0;i<d.length;i+=4,p++){
          const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
          gray[p]=g;
          if(g<min) min=g; if(g>maxv) maxv=g;
        }
        const span=Math.max(1,maxv-min);
        for(let i=0,p=0;i<d.length;i+=4,p++){
          let v=((gray[p]-min)/span)*255;
          // mild extra contrast after stretch
          v=128+1.15*(v-128);
          if(v<0) v=0; else if(v>255) v=255;
          d[i]=d[i+1]=d[i+2]=v;
        }
        ctx.putImageData(id,0,0);
        resolve(c.toDataURL("image/png"));
      };
      if(bitmap){
        draw(bitmap.width,bitmap.height,(ctx,w,h)=>ctx.drawImage(bitmap,0,0,w,h));
        try{ bitmap.close&&bitmap.close(); }catch(_){}
        return;
      }
      const img=new Image();
      img.onload=()=>{
        try{ draw(img.width,img.height,(ctx,w,h)=>ctx.drawImage(img,0,0,w,h)); }
        catch(e){ reject(e); }
      };
      img.onerror=()=>reject(new Error("img"));
      img.src=dataUrl;
    }catch(e){ reject(e); }
  });
}
async function runReceiptOCR(dataUrl){
  const status=document.getElementById("ocrStatus");
  if(status) status.textContent="Reading total…";
  try{
    await loadTesseract();
    let ocrSrc=dataUrl;
    try{ ocrSrc=await preprocessReceiptForOCR(dataUrl); }catch(_){ /* use original */ }
    const psms=["6","11","4"];
    let best=null;
    for(const psm of psms){
      try{
        if(status) status.textContent="Reading total…";
        const result=await Tesseract.recognize(ocrSrc,"eng",{logger:()=>{},tessedit_pageseg_mode:psm});
        const parsed=parseReceiptText(result?.data?.text||"");
        if(parsed.total==null) continue;
        if(!best || (parsed.kwScore||0)>(best.kwScore||0)) best=parsed;
        // Early stop if we already have a strong keyword (grand total / total paid)
        if((parsed.kwScore||0)>=80) break;
      }catch(_){ /* try next psm */ }
    }
    if(!best){
      try{
        const result=await Tesseract.recognize(ocrSrc,"eng",{logger:()=>{}});
        best=parseReceiptText(result?.data?.text||"");
      }catch(_){ best={total:null,merchant:"",kwScore:0}; }
    }
    const parsed=best||{total:null,merchant:"",kwScore:0};
    const amtEl=document.getElementById("dmgAmt");
    const noteEl=document.getElementById("dmgNote");
    const curEl=document.getElementById("dmgCurrency");
    if(curEl) curEl.value="USD";
    if(amtEl && parsed.total!=null) amtEl.value=String(parsed.total);
    if(noteEl && parsed.merchant && !(noteEl.value||"").trim()) noteEl.value=parsed.merchant;
    if(status){
      if(parsed.total!=null)
        status.textContent="Total found — check it, then Add.";
      else
        status.textContent="Couldn’t find a total — type it in.";
    }
  }catch(e){
    if(status) status.textContent="OCR unavailable — enter total manually.";
  }
}
function onReceiptPhoto(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const status=document.getElementById("ocrStatus");
  if(status) status.textContent="";
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas");
      const max=1400; let w=img.width,h=img.height;
      if(w>max){ h=h*(max/w); w=max; }
      c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      pendingPhoto=c.toDataURL("image/jpeg",0.7);
      const p=document.getElementById("receiptPreview");
      if(p){ p.src=pendingPhoto; p.style.display="block"; }
      runReceiptOCR(pendingPhoto);
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

    amount:amt,
    currency,
    cat:window._dmgCat||"other",
    note:(document.getElementById("dmgNote")?.value||"").trim(),
    photo:pendingPhoto||"",
    ts:new Date().toISOString(),
    items:[]
  });
  saveDamages(list);
  pendingPhoto="";
  drawDamages();
}
function delDamage(id){
  saveDamages(loadDamages().filter(i=>i.id!==id));
  drawDamages();
}
function clearToday(){
  if(!confirm('Clear today?')) return;
  saveDamages([]);
  drawDamages();
}
function delDay(d){
  if(!confirm(`Delete ${formatDayLabel(d)} and all its receipts?`)) return;
  const s=loadStore();
  delete s[d];
  saveStore(s);
  saveBudget(d, null); // clears that day's budget too
  drawDamages();
  toast("Day deleted.");
}

function goBack(){
  if(view==="menu" && currentPark) openPark(currentPark.id, currentPark.name, "food");
  else if(view==="waits"||view==="food") showParkList(mode||"waits");
  else renderHome();
}
function refreshCurrent(){
  if(currentPark && (view==="waits"||view==="food")) openPark(currentPark.id, currentPark.name, view);
}
// Keep wait times fresh while a park is open: silent refresh every 60s when the tab is visible
setInterval(()=>{
  if((view==="waits"||view==="food") && currentPark && !document.hidden){
    refreshParkData(currentPark.id, view, true);
  }
}, 60000);

async function loadHome(){
  showLoading("Loading parks…");
  try{
    const res=await fetchTimeout(`${API}/destinations`);
    if(!res.ok) throw new Error("dest");
    const data=await res.json();
    destinations=(data.destinations||[]).filter(d=>d.parks&&d.parks.length);
    try{ localStorage.setItem("pd_destinations", JSON.stringify({ts:Date.now(), data:destinations})); }catch{}
    renderHome();
  }catch(e){
    // Park wifi is spotty — fall back to the last park list we successfully loaded
    try{
      const cached=JSON.parse(localStorage.getItem("pd_destinations")||"null");
      if(cached && cached.data && cached.data.length){
        destinations=cached.data;
        renderHome();
        toast("Offline — showing your last park list.");
        return;
      }
    }catch{}
    showError("Could not load the park list.");
  }
}
migrateStore();
loadHome();
ensureFxRates().then(()=>{ if(view==="damages") drawDamages(); }).catch(()=>{});
</script>
</body>
</html>
